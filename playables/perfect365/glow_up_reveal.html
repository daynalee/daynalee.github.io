</div><div id="endcard-stars">&#9733;&#9733;&#9733;&#9733;&#9733; 4.8 &nbsp;&middot;&nbsp; 100M+ users</div><div id="endcard-msg">6,400+ looks. Yours in one tap.</div><div id="endcard-sub">7 day free trial. Cancel anytime.</div><div id="endcard-cta">Start free trial</div><div id="endcard-badges">APP STORE &nbsp;&middot;&nbsp; GOOGLE PLAY</div></div>
<script>
var STORE_URLS={Android:'https://play.google.com/store/apps/details?id=com.arcsoft.perfect365',iOS:'https://apps.apple.com/app/id475976577'};
function detectPlatform(){var ua=(navigator.userAgent||navigator.vendor||'');if(/iPad|iPhone|iPod/.test(ua))return 'iOS';return 'Android';}
var PLATFORM=detectPlatform();
var started=false,HAS_AUDIO=false,userMuted=false,viewable=false,visible=true,hostVolume=null,paused=false;
function start(){if(typeof mraid==='undefined'){viewable=true;visible=true;showAd();return;}if(mraid.getState&&mraid.getState()==='loading'){mraid.addEventListener('ready',onSdkReady);}else{onSdkReady();}}
function onSdkReady(){mraid.addEventListener('viewableChange',onViewableChange);mraid.addEventListener('audioVolumeChange',onAudioVolumeChange);if(mraid.isViewable()){viewable=true;showAd();}}
function onViewableChange(v){viewable=v;if(v){started?resumeAd():showAd();}else{pauseAd();}applyAudioState();}
function showAd(){started=true;document.getElementById('cta').style.display='block';if(HAS_AUDIO){document.getElementById('mute').style.display='block';updateMuteButton();}armMechanic();showTutorial();armIdle();applyAudioState();}
function resumeAd(){paused=false;applyAudioState();}
function pauseAd(){paused=true;applyAudioState();}
function openStore(){var url=STORE_URLS[PLATFORM];if(typeof mraid!=='undefined'){mraid.open(url);return;}var w=window.open(url,'_blank');if(!w){window.location.href=url;}}
document.getElementById('cta').addEventListener('click',openStore);
function audioShouldPlay(){if(!HAS_AUDIO)return false;if(userMuted)return false;if(hostVolume===0)return false;if(!viewable||!visible)return false;return true;}
function applyAudioState(){updateMuteButton();}
function updateMuteButton(){var b=document.getElementById('mute');if(!b)return;var s=(hostVolume===0);b.innerHTML=(userMuted||s)?'&#128263;':'&#128264;';}
function toggleMute(){userMuted=!userMuted;applyAudioState();}
function onAudioVolumeChange(v){hostVolume=(typeof v==='number')?v:null;applyAudioState();}
document.getElementById('mute').addEventListener('click',toggleMute);
document.addEventListener('visibilitychange',function(){visible=(document.visibilityState!=='hidden');applyAudioState();});
var IDLE_MS=2500,idleTimer=null,engaged=false,solved=false;
function showTutorial(){var h=document.getElementById('hint');if(h)h.style.display='block';}
function hideTutorial(){var h=document.getElementById('hint');if(h)h.style.display='none';}
function armIdle(){clearIdle();idleTimer=setTimeout(function(){if(!solved)showTutorial();},IDLE_MS);}
function resetIdle(){hideTutorial();armIdle();}
function clearIdle(){if(idleTimer){clearTimeout(idleTimer);idleTimer=null;}}
(function(){var s=document.getElementById('stage');function onInteract(){resetIdle();}s.addEventListener('touchstart',onInteract,false);s.addEventListener('mousedown',onInteract,false);})();
function onFirstInteraction(){engaged=true;hideTutorial();}
function feedback(kind,txt){var fx=document.getElementById('fx');if(!fx)return;fx.innerHTML=txt||((kind==='fail')?'Try again':'Nice!');fx.style.color=(kind==='fail')?'#ff6b6b':'#d4a94a';fx.style.transition='none';fx.style.opacity='1';setTimeout(function(){fx.style.transition='opacity .6s';fx.style.opacity='0';},500);}
function sparkle(x,y){var st=document.getElementById('stage');for(var i=0;i<10;i++){var s=document.createElement('div');s.className='spark';s.style.left=x+'px';s.style.top=y+'px';st.appendChild(s);(function(el,ang){var d=40+Math.random()*50;setTimeout(function(){el.style.transition='all .55s ease-out';el.style.opacity='1';el.style.left=(x+Math.cos(ang)*d)+'px';el.style.top=(y+Math.sin(ang)*d)+'px';el.style.opacity='0';},10);setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},700);})(s,i/10*Math.PI*2);}}
function centerOf(el){var r=el.getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+r.height/2};}
function showEndCard(msg){hideTutorial();clearIdle();solved=true;var ec=document.getElementById('endcard');if(msg){document.getElementById('endcard-msg').innerHTML=msg;}ec.style.display='-webkit-flex';ec.style.display='flex';}
(function(){document.getElementById('endcard').addEventListener('click',openStore,false);})();
var PW=540,PH=583;
function relayout(){var p=document.getElementById('photo');if(!p)return;var W=window.innerWidth,H=window.innerHeight,land=W>H;var frac=land?0.70:(typeof PHOTO_H==='number'?PHOTO_H:0.64);var ph=H*frac;var pw=ph*(PW/PH);var maxw=land?W*0.46:W*0.9;if(pw>maxw){pw=maxw;ph=pw*(PH/PW);}p.style.height=ph+'px';p.style.width=pw+'px';if(typeof onRelayout==='function')onRelayout();}
function onOrientationOrResize(){relayout();if(window.requestAnimationFrame){window.requestAnimationFrame(relayout);}else{setTimeout(relayout,50);}}
window.addEventListener('resize',onOrientationOrResize);window.addEventListener('orientationchange',onOrientationOrResize);

var pos=0.14,dragging=false,revealed=false,looksTried={1:1},lookCount=1;
function setPos(f){pos=Math.max(0,Math.min(1,f));var p=document.getElementById('photo'),w=p.offsetWidth,x=Math.round(w*pos);document.getElementById('reveal').style.clip='rect(0px,'+x+'px,9999px,0px)';document.getElementById('knob').style.left=(x-2)+'px';}
function onRelayout(){setPos(pos);}
function fx(e){var t=(e.touches&&e.touches[0])||e;var r=document.getElementById('photo').getBoundingClientRect();return (t.clientX-r.left)/r.width;}
function armMechanic(){var p=document.getElementById('photo');p.addEventListener('touchstart',ds,false);p.addEventListener('mousedown',ds,false);document.addEventListener('touchmove',dm,false);document.addEventListener('mousemove',dm,false);document.addEventListener('touchend',de,false);document.addEventListener('mouseup',de,false);var chips=document.querySelectorAll('.chip');for(var i=0;i<chips.length;i++)chips[i].addEventListener('click',onChip,false);setPos(0.14);}
function ds(e){if(solved||paused)return;dragging=true;onFirstInteraction();setPos(fx(e));e.preventDefault();}
function dm(e){if(!dragging)return;setPos(fx(e));if(pos>0.6&&!revealed){revealed=true;var c=centerOf(document.getElementById('photo'));sparkle(c.x,c.y);feedback('ok','Glow up!');document.getElementById('headline').innerHTML='Now tap a look to switch it up.';document.getElementById('hint-text').innerHTML='Tap a look';document.getElementById('hand').style.top='80%';document.getElementById('hand').style.left='50%';}e.preventDefault();}
function de(){dragging=false;}
function onChip(e){if(solved||paused)return;var el=e.currentTarget,i=parseInt(el.getAttribute('data-i'),10);onFirstInteraction();var chips=document.querySelectorAll('.chip');for(var k=0;k<chips.length;k++)chips[k].className='chip';el.className='chip on';var lays=document.querySelectorAll('.lay');for(var k=0;k<lays.length;k++)lays[k].className='lay';document.getElementById('r'+i).className='lay on';if(pos<0.6){setPos(1);revealed=true;}var c=centerOf(document.getElementById('photo'));sparkle(c.x,c.y-30);if(!looksTried[i]){looksTried[i]=1;lookCount++;}feedback('ok',['','Bright!','Smooth!','Sculpted!'][i]);if(lookCount>=3){document.getElementById('headline').innerHTML='Now try it on your face.';setTimeout(function(){if(!solved)showEndCard('6,400+ looks. Yours in one tap.');},1800);}}

relayout();
start();
